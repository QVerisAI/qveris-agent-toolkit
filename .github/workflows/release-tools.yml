name: Coordinated release tools

on:
  pull_request:
    paths:
      - ".github/workflows/release-tools.yml"
      - ".github/workflows/cli-publish.yml"
      - ".github/workflows/js-sdk-publish.yml"
      - ".github/workflows/mcp-publish.yml"
      - ".github/workflows/python-sdk-publish.yml"
      - "RELEASING.md"
      - "package.json"
      - ".cursor-plugin/plugin.json"
      - "benchmarks/discover-call/cadence.json"
      - "scripts/benchmark-release-cadence.mjs"
      - "scripts/benchmark-release-cadence.test.mjs"
      - "scripts/release-client-packages.mjs"
      - "scripts/release-client-packages.test.mjs"
      - "scripts/*release*"
      - "scripts/publish-verified-js.mjs"
      - "maintenance/RELEASE_REPORT_TEMPLATE.md"
      - "packages/cli/package.json"
      - "packages/cli/package-lock.json"
      - "packages/cli/CHANGELOG.md"
      - "packages/mcp/package.json"
      - "packages/mcp/package-lock.json"
      - "packages/mcp/server.json"
      - "packages/mcp/CHANGELOG.md"
      - "packages/js-sdk/package.json"
      - "packages/js-sdk/package-lock.json"
      - "packages/js-sdk/CHANGELOG.md"
      - "packages/python-sdk/pyproject.toml"
      - "packages/python-sdk/uv.lock"
      - "packages/python-sdk/CHANGELOG.md"
      - "docs/**/cli.md"
      - "docs/**/mcp-server.md"
      - "docs/**/js-sdk.md"
      - "docs/**/python-sdk.md"
      - "agent/GUIDELINES.md"
      - "agent/SETUP.md"
      - "agent/llms.txt"
      - "agent/llms-full.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-tools.yml"
      - ".github/workflows/cli-publish.yml"
      - ".github/workflows/js-sdk-publish.yml"
      - ".github/workflows/mcp-publish.yml"
      - ".github/workflows/python-sdk-publish.yml"
      - "RELEASING.md"
      - "package.json"
      - ".cursor-plugin/plugin.json"
      - "benchmarks/discover-call/cadence.json"
      - "scripts/benchmark-release-cadence.mjs"
      - "scripts/benchmark-release-cadence.test.mjs"
      - "scripts/release-client-packages.mjs"
      - "scripts/release-client-packages.test.mjs"
      - "scripts/*release*"
      - "scripts/publish-verified-js.mjs"
      - "maintenance/RELEASE_REPORT_TEMPLATE.md"
      - "packages/cli/package.json"
      - "packages/cli/package-lock.json"
      - "packages/cli/CHANGELOG.md"
      - "packages/mcp/package.json"
      - "packages/mcp/package-lock.json"
      - "packages/mcp/server.json"
      - "packages/mcp/CHANGELOG.md"
      - "packages/js-sdk/package.json"
      - "packages/js-sdk/package-lock.json"
      - "packages/js-sdk/CHANGELOG.md"
      - "packages/python-sdk/pyproject.toml"
      - "packages/python-sdk/uv.lock"
      - "packages/python-sdk/CHANGELOG.md"
      - "docs/**/cli.md"
      - "docs/**/mcp-server.md"
      - "docs/**/js-sdk.md"
      - "docs/**/python-sdk.md"
      - "agent/GUIDELINES.md"
      - "agent/SETUP.md"
      - "agent/llms.txt"
      - "agent/llms-full.txt"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Test coordinated release tooling
        run: npm run test:release-clients
