name: Coordinated release tools

on:
  pull_request:
    paths:
      - ".github/workflows/release-tools.yml"
      - ".github/workflows/cli-publish.yml"
      - ".github/workflows/js-sdk-publish.yml"
      - ".github/workflows/mcp-publish.yml"
      - ".github/workflows/python-sdk-publish.yml"
      - ".github/workflows/discover-call-cadence.yml"
      - "RELEASING.md"
      - "package.json"
      - "benchmarks/discover-call/cadence.json"
      - "scripts/benchmark-release-cadence.mjs"
      - "scripts/benchmark-release-cadence.test.mjs"
      - "scripts/release-client-packages.mjs"
      - "scripts/release-client-packages.test.mjs"
      - "packages/cli/package.json"
      - "packages/cli/package-lock.json"
      - "packages/cli/CHANGELOG.md"
      - "packages/mcp/package.json"
      - "packages/mcp/package-lock.json"
      - "packages/mcp/server.json"
      - "packages/mcp/CHANGELOG.md"
      - "packages/js-sdk/package.json"
      - "packages/js-sdk/package-lock.json"
      - "packages/js-sdk/CHANGELOG.md"
      - "packages/python-sdk/pyproject.toml"
      - "packages/python-sdk/uv.lock"
      - "packages/python-sdk/CHANGELOG.md"
      - "docs/**/cli.md"
      - "docs/**/mcp-server.md"
      - "docs/**/js-sdk.md"
      - "docs/**/python-sdk.md"
      - "agent/GUIDELINES.md"
      - "agent/SETUP.md"
      - "agent/llms.txt"
      - "agent/llms-full.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-tools.yml"
      - ".github/workflows/cli-publish.yml"
      - ".github/workflows/js-sdk-publish.yml"
      - ".github/workflows/mcp-publish.yml"
      - ".github/workflows/python-sdk-publish.yml"
      - ".github/workflows/discover-call-cadence.yml"
      - "RELEASING.md"
      - "package.json"
      - "benchmarks/discover-call/cadence.json"
      - "scripts/benchmark-release-cadence.mjs"
      - "scripts/benchmark-release-cadence.test.mjs"
      - "scripts/release-client-packages.mjs"
      - "scripts/release-client-packages.test.mjs"
      - "packages/cli/package.json"
      - "packages/cli/package-lock.json"
      - "packages/cli/CHANGELOG.md"
      - "packages/mcp/package.json"
      - "packages/mcp/package-lock.json"
      - "packages/mcp/server.json"
      - "packages/mcp/CHANGELOG.md"
      - "packages/js-sdk/package.json"
      - "packages/js-sdk/package-lock.json"
      - "packages/js-sdk/CHANGELOG.md"
      - "packages/python-sdk/pyproject.toml"
      - "packages/python-sdk/uv.lock"
      - "packages/python-sdk/CHANGELOG.md"
      - "docs/**/cli.md"
      - "docs/**/mcp-server.md"
      - "docs/**/js-sdk.md"
      - "docs/**/python-sdk.md"
      - "agent/GUIDELINES.md"
      - "agent/SETUP.md"
      - "agent/llms.txt"
      - "agent/llms-full.txt"

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Test coordinated release tooling
        run: npm run test:release-clients
