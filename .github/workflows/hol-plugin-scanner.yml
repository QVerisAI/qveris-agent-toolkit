name: HOL Plugin Scanner

on:
  pull_request:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@37a0b7035b989c0bcd1177dd7f6c77b49dab7c2f # v1.2.809
        with:
          plugin_dir: "."
          format: json
          output: scanner-report.json
          min_score: 80
          fail_on_severity: high

      - name: Preserve scanner findings even when the threshold fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-scanner-report
          path: scanner-report.json
          if-no-files-found: warn
