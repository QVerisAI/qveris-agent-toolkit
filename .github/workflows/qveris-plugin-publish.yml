name: Publish QVeris OpenClaw plugin to npm

on:
  push:
    tags:
      - "qveris-plugin-v*"

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/openclaw-qveris-plugin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org

      - name: Verify package version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#qveris-plugin-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Verify CHANGELOG has an entry for this version
        run: |
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — move the Unreleased notes into a release section before tagging"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify npm package contents
        run: npm run check:pack
        env:
          NPM_CONFIG_OFFLINE: "true"

      - name: Verify packed plugin with the latest stable OpenClaw runtime
        run: npm run check:runtime:packed

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published npm artifact with OpenClaw
        run: npm run check:runtime:registry -- --expected-git-head "$GITHUB_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "QVeris OpenClaw Plugin v${{ env.VERSION }}"
          body: |
            ## Install

            ```bash
            openclaw plugins install @qverisai/qveris@${{ env.VERSION }}
            ```

            ## Highlights

            - Declares `qveris_discover`, `qveris_call`, and `qveris_inspect` in `contracts.tools`.
            - Adds explicit startup activation and API-key availability metadata for current OpenClaw hosts.
            - Marks read-only Discover/Inspect replay-safe while keeping paid Call replay-unsafe.
            - Verifies source and packed-package registration against supported OpenClaw runtimes.

            See [README](packages/openclaw-qveris-plugin/README.md) for usage.
          generate_release_notes: true
