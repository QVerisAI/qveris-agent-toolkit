name: Docs checks

# Guard the docs locale structure (en-US / zh-CN / cn/zh-CN) against silent
# drift. See #162 and scripts/check-doc-locales.mjs.

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README*.md"
      - "agent/**"
      - "skills/**"
      - "ecosystem/**"
      - "recipes/**"
      - "packages/**/README*.md"
      - "packages/cli/**"
      - "packages/mcp/src/types.ts"
      - "docs/openapi/**"
      - "scripts/check-public-copy*"
      - "package.json"
      - ".cursor-plugin/**"
      - "gemini-extension.json"
      - "glama.json"
      - "mcp.json"
      - "smithery.yaml"
      - "packages/**/package.json"
      - "packages/**/server.json"
      - "packages/**/openclaw.plugin.json"
      - "docs/en-US/**"
      - "docs/zh-CN/**"
      - "docs/cn/**"
      - "packages/js-sdk/src/**"
      - "packages/js-sdk/docs-api/**"
      - "packages/js-sdk/typedoc.json"
      - "packages/js-sdk/package.json"
      - "packages/js-sdk/package-lock.json"
      - "packages/python-sdk/qveris/**"
      - "packages/python-sdk/docs-api/**"
      - "packages/python-sdk/pyproject.toml"
      - "packages/python-sdk/uv.lock"
      - "scripts/check-doc-locales.mjs"
      - "scripts/prepare-website-docs.mjs"
      - "scripts/prepare-website-docs.test.mjs"
      - "scripts/release-tag-version.mjs"
      - "scripts/website-release-tags.mjs"
      - "scripts/website-release-tags.test.mjs"
      - "scripts/sync-website-client-versions.mjs"
      - "scripts/sync-website-client-versions.test.mjs"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/sync-docs-to-website.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README*.md"
      - "agent/**"
      - "skills/**"
      - "ecosystem/**"
      - "recipes/**"
      - "packages/**/README*.md"
      - "packages/cli/**"
      - "packages/mcp/src/types.ts"
      - "docs/openapi/**"
      - "scripts/check-public-copy*"
      - "package.json"
      - ".cursor-plugin/**"
      - "gemini-extension.json"
      - "glama.json"
      - "mcp.json"
      - "smithery.yaml"
      - "packages/**/package.json"
      - "packages/**/server.json"
      - "packages/**/openclaw.plugin.json"
      - "docs/en-US/**"
      - "docs/zh-CN/**"
      - "docs/cn/**"
      - "packages/js-sdk/src/**"
      - "packages/js-sdk/docs-api/**"
      - "packages/js-sdk/typedoc.json"
      - "packages/js-sdk/package.json"
      - "packages/js-sdk/package-lock.json"
      - "packages/python-sdk/qveris/**"
      - "packages/python-sdk/docs-api/**"
      - "packages/python-sdk/pyproject.toml"
      - "packages/python-sdk/uv.lock"
      - "scripts/check-doc-locales.mjs"
      - "scripts/prepare-website-docs.mjs"
      - "scripts/prepare-website-docs.test.mjs"
      - "scripts/release-tag-version.mjs"
      - "scripts/website-release-tags.mjs"
      - "scripts/website-release-tags.test.mjs"
      - "scripts/sync-website-client-versions.mjs"
      - "scripts/sync-website-client-versions.test.mjs"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/sync-docs-to-website.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: packages/js-sdk/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: packages/python-sdk/uv.lock
      - name: Generate TypeScript API reference
        working-directory: packages/js-sdk
        run: npm ci && npm run docs:generate
      - name: Generate Python API reference
        working-directory: packages/python-sdk
        run: uv lock --check && uv run --frozen --extra dev python docs-api/generate.py
      - name: Check generated reference drift
        run: git diff --exit-code -- docs/en-US/js-sdk-api.md docs/zh-CN/js-sdk-api.md docs/en-US/python-sdk-api.md docs/zh-CN/python-sdk-api.md

  locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
      - name: Check toolkit public copy
        run: npm run check:public-copy && npm run test:public-copy
      - name: Check pinned OpenClaw public copy
        run: node --test skills/openclaw/tests/public-copy.test.mjs
      - name: Check doc locale consistency
        run: node scripts/check-doc-locales.mjs
      - name: Test release-aware website docs staging
        run: >-
          node --test
          scripts/prepare-website-docs.test.mjs
          scripts/sync-website-client-versions.test.mjs
          scripts/website-release-tags.test.mjs
